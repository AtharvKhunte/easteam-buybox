<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EASTEAM Daydream Skirt – buy box, after</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1ec;--card:#fffdfb;--ink:#1b1517;--mute:#7d7176;--line:#e4dcd6;--blush:#ecd3d6;--wine:#8a4a52;--ok:#4d6b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.5}
.page{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:15px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
.note{color:var(--mute);font-size:14px;margin:0 0 28px;max-width:70ch}
.stage{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.frame{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px}
.frame.d{flex:1 1 520px;max-width:620px}
.frame.m{flex:0 0 390px;max-width:100%;padding:22px 18px}
.tag{font-size:12px;color:var(--mute);margin-bottom:14px}
.bb h2{font-weight:400;font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin:0;line-height:1.25;overflow-wrap:anywhere}
.m .bb h2{font-size:19px}
.price{font-size:20px;font-weight:400;margin:8px 0 18px}
.price s{color:var(--mute);font-size:15px;margin-left:8px}
.lbl{font-size:13px;color:var(--mute);margin:0 0 8px}
.lbl b{color:var(--ink);font-weight:500}
.sw{display:flex;gap:12px;margin-bottom:20px}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:block}
.sw i.on{outline:1.5px solid var(--ink);outline-offset:3px}
.sizehead{display:flex;justify-content:space-between;align-items:baseline}
.sizehead a{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sz{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:11px 6px 9px;border-radius:2px;cursor:pointer;text-align:center;min-height:62px}
.sz:focus-visible,.cta:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.sz b{display:block;font-weight:500;font-size:16px}
.sz small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.sz.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sz.on small{color:var(--bg);opacity:.8}
.sz.mto{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--blush) 6px 7px)}
.sz.mto.on{background:var(--ink)}
.sizes.err .sz{border-color:var(--wine)}
.msg{font-size:13.5px;color:var(--wine);min-height:22px;margin:8px 0 0}
.status{border-left:2px solid var(--blush);padding:4px 0 4px 14px;margin:12px 0 18px;font-size:14.5px;min-height:70px}
.status strong{font-weight:500;display:block}
.status .ok{color:var(--ok)}
.status .why{color:var(--mute);font-size:13px;display:block;margin-top:2px}
.meas{color:var(--mute);font-size:13px;margin-top:4px;display:block}
.cta{width:100%;font:inherit;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding:16px;border-radius:2px;cursor:pointer;margin-bottom:10px}
.cta.p{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.cta.s{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.ship{display:grid;grid-template-columns:1fr;gap:6px;border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:14px}
.ship div{display:flex;gap:10px;justify-content:space-between}
.ship span:first-child{color:var(--mute)}
.ship a{color:var(--ink);text-underline-offset:3px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}}
</style>
</head>
<body>
<div class="page">
<h1>Daydream Skirt – buy box, after</h1>
<p class="note">Fixes: sold-out sizes labelled, per-size status line, inline error, delivery and returns beside the button, stock/made-to-order cards stacked so nothing breaks on mobile. Try it: tap a size, tap L, or press Add to cart with no size.</p>
<div class="stage">
<section class="frame d"><div class="tag">Desktop</div><div id="d"></div></section>
<section class="frame m"><div class="tag">Mobile, 390px</div><div id="m"></div></section>
</div>
</div>
<script>
var SIZES=[{k:"S",n:20,m:'Bust 33" · Waist 26" · Hip 36"'},{k:"M",n:12,m:'Bust 35" · Waist 28" · Hip 38"'},{k:"L",n:0,m:'Bust 37" · Waist 30" · Hip 40"'}];
var P_STOCK="Rs. 24,500",P_MTO="Rs. 23,200";
function build(id){
  var root=document.getElementById(id),sel=null;
  root.innerHTML='<div class="bb">'+
  '<h2>Daydream Skirt – Midnight Noir</h2>'+
  '<div class="price" data-p>'+P_STOCK+'</div>'+
  '<p class="lbl">Colour <b>Midnight Noir</b></p>'+
  '<div class="sw"><i style="background:#d9a63a"></i><i style="background:#ecd3d6"></i><i style="background:#ece6dc"></i><i class="on" style="background:#2a2326"></i></div>'+
  '<div class="sizehead"><p class="lbl">Size</p><a href="#" onclick="return false">Size guide</a></div>'+
  '<div class="sizes" data-s></div>'+
  '<p class="msg" data-e role="alert"></p>'+
  '<div class="status" data-st><strong>Select a size</strong><span class="why">Each size shows what is in stock and when it ships.</span></div>'+
  '<button class="cta p" data-add>Add to cart</button>'+
  '<button class="cta s">Checkout now</button>'+
  '<div class="ship"><div><span>Ships</span><span data-ship>Pick a size to see</span></div>'+
  '<div><span>Returns</span><span>[X]-day returns · <a href="#" onclick="return false">Policy</a></span></div>'+
  '<div><span>Fit</span><span>Model is 5\'7", wears S</span></div></div></div>';
  var box=root.querySelector("[data-s]");
  SIZES.forEach(function(s){
    var b=document.createElement("button");
    b.className="sz"+(s.n?"":" mto");b.type="button";
    b.innerHTML="<b>"+s.k+"</b><small>"+(s.n?s.n+" left":"Made to order")+"</small>";
    b.onclick=function(){pick(s,b)};
    box.appendChild(b);
  });
  function pick(s,b){
    sel=s;
    [].forEach.call(box.children,function(x){x.classList.remove("on")});
    b.classList.add("on");
    box.classList.remove("err");
    root.querySelector("[data-e]").textContent="";
    var st=root.querySelector("[data-st]");
    if(s.n){
      st.innerHTML='<strong class="ok">In stock · '+s.n+' left</strong><span class="why">Ships within 3 days</span><span class="meas">'+s.m+'</span>';
      root.querySelector("[data-p]").innerHTML=P_STOCK;
      root.querySelector("[data-ship]").textContent="Within 3 days";
    }else{
      st.innerHTML='<strong>Made to order · 5% off</strong><span class="why">Size '+s.k+' is sold out. We make it for you, ships within 6 weeks.</span><span class="meas">'+s.m+'</span>';
      root.querySelector("[data-p]").innerHTML=P_MTO+' <s>'+P_STOCK+'</s>';
      root.querySelector("[data-ship]").textContent="Within 6 weeks";
    }
  }
  root.querySelector("[data-add]").onclick=function(){
    if(!sel){
      box.classList.add("err");
      root.querySelector("[data-e]").textContent="Choose a size to add this skirt to your cart.";
      box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");
      box.children[0].focus();
    }else{
      this.textContent="Added · View cart";
    }
  };
}
build("d");build("m");
</script>
</body>
</html>
